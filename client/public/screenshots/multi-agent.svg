<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b13"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">10-LENS MULTI-AGENT RESEARCH</text>
  <text x="60" y="85" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Konteks terisolasi di atas data terverifikasi: RSS CoinDesk/CoinTelegraph/Indodax Blog, ticker Indodax, dan scanner ancaman deterministik.</text>
  <rect x="980" y="48" width="160" height="34" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="1060" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">⚡ 50/50 Multi-Account</text>

  <!-- Agent Cards Grid (2 rows x 3 columns) -->
  <!-- Agent 1 -->
  <g transform="translate(40, 120)">
    <rect width="360" height="160" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Analis Berita Global</text>
    <rect x="250" y="15" width="90" height="20" rx="4" fill="#064e3b"/>
    <text x="295" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">SCORE: +0.75</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">BTC Institutional Inflows Exceed $1.2B</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Inflow spot ETF menunjukkan akumulasi stabil. BTC Macro Crash filter memberi izin entri altcoin.</text>
    <line x1="20" y1="125" x2="340" y2="125" stroke="#1e293b"/>
    <text x="20" y="145" font-family="monospace" font-size="10" fill="#64748b">Sumber: CoinDesk RSS &#8226;#8226; 45s ago</text>
  </g>

  <!-- Agent 2 -->
  <g transform="translate(420, 120)">
    <rect width="360" height="160" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ec4899">Pemburu Momentum</text>
    <rect x="250" y="15" width="90" height="20" rx="4" fill="#064e3b"/>
    <text x="295" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">SCORE: +0.85</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">PEPE Memimpin Top Gainer Indodax</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">PEPE masuk jajaran gainer 24 jam dengan volume tinggi. Kedalaman order book diverifikasi terpisah oleh entry gate.</text>
    <line x1="20" y1="125" x2="340" y2="125" stroke="#1e293b"/>
    <text x="20" y="145" font-family="monospace" font-size="10" fill="#64748b">Sumber: Indodax Market Tickers &#8226;#8226; 95s ago</text>
  </g>

  <!-- Agent 3 -->
  <g transform="translate(800, 120)">
    <rect width="360" height="160" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#10b981">Radar Keamanan (Headline Scanner)</text>
    <rect x="250" y="15" width="90" height="20" rx="4" fill="#1e293b"/>
    <text x="295" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">NO THREAT</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Tidak Ada Kata Kunci Exploit di Headline RSS</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Pemindai deterministik tidak menemukan kata kunci hack/exploit/delisting. Ini bukan audit smart contract.</text>
    <line x1="20" y1="125" x2="340" y2="125" stroke="#1e293b"/>
    <text x="20" y="145" font-family="monospace" font-size="10" fill="#64748b">Sumber: CoinTelegraph RSS &#8226;#8226; 140s ago</text>
  </g>

  <!-- Agent 4 -->
  <g transform="translate(40, 300)">
    <rect width="360" height="160" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a855f7">Pemburu Momentum</text>
    <rect x="250" y="15" width="90" height="20" rx="4" fill="#064e3b"/>
    <text x="295" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">SCORE: +0.80</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">SOL 15m EMA 21 Bullish Crossover</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">RSI 14 berada di 61.5 dengan volume ekspansi. ATR 14 memberikan ruang trailing stop ideal 2.8%.</text>
    <line x1="20" y1="125" x2="340" y2="125" stroke="#1e293b"/>
    <text x="20" y="145" font-family="monospace" font-size="10" fill="#64748b">Sumber: Indodax Market Tickers &#8226;#8226; 180s ago</text>
  </g>

  <!-- Agent 5: Master Confluence -->
  <g transform="translate(420, 300)">
    <rect width="360" height="160" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#818cf8">Master AI Confluence Evaluator</text>
    <rect x="250" y="15" width="90" height="20" rx="4" fill="#312e81"/>
    <text x="295" y="29" font-family="monospace" font-size="10" font-weight="800" fill="#c7d2fe" text-anchor="middle">VERDICT: BUY</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Gerbang Deterministik + Evaluasi Risiko AI</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#c7d2fe">Sinyal harus lolos seluruh gerbang risiko. Di mode Live, kegagalan AI memblokir entry baru (fail-closed).</text>
    <line x1="20" y1="125" x2="340" y2="125" stroke="#4338ca"/>
    <text x="20" y="145" font-family="monospace" font-size="10" fill="#a5b4fc">Claude Sonnet 4.6 via Antigravity OAuth</text>
  </g>

  <!-- Agent 6 -->
  <g transform="translate(800, 300)">
    <rect width="360" height="160" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Analis Likuiditas &amp; Spread</text>
    <rect x="250" y="15" width="90" height="20" rx="4" fill="#064e3b"/>
    <text x="295" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">SPREAD: 0.08%</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Top-of-Book BTC/IDR Tight Spread</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Spread bid/ask dan volume 24 jam ditinjau dari ticker publik Indodax. Tidak ada data on-chain.</text>
    <line x1="20" y1="125" x2="340" y2="125" stroke="#1e293b"/>
    <text x="20" y="145" font-family="monospace" font-size="10" fill="#64748b">Sumber: Indodax Market Tickers &#8226;#8226; 4m ago</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="40" y="480" width="1120" height="160" rx="12" fill="#0b101b" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="520" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">ARSITEKTUR SWARM SELF-LEARNING (POST-MORTEM REVIEW)</text>
  <text x="60" y="545" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Setiap trade yang selesai (TP maupun SL) di-evaluasi secara otonom oleh AI Reviewer dan disimpan ke tabel SQLite `lessons_learned`.</text>
  <text x="60" y="570" font-family="monospace" font-size="11" fill="#38bdf8">Memori kognitif: pelajaran disimpan per trade tertutup &#8226;#8226; Tidak ada jaminan performa atau win rate</text>
</svg>
