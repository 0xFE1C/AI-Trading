<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="dirCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dirGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1100" height="520" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />

  <!-- Title -->
  <text x="50" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
    📂 PROJECT DIRECTORY ARCHITECTURE MAP
  </text>
  <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    Modular architecture separating Frontend Client (PWA), Core Quantitative Engine, Multi-Agent Swarm, and Test Suite.
  </text>

  <!-- Box 1: client/ (Frontend PWA) -->
  <g transform="translate(50, 95)">
    <rect width="485" height="185" rx="12" fill="url(#dirCardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#dirGlow)" />
    <rect x="0" y="0" width="485" height="32" rx="12" fill="#0284c7" />
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      📁 client/ — Frontend React 18 &amp; PWA
    </text>
    
    <text x="16" y="56" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="600">client/public/</text>
    <text x="140" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Manifest PWA, service worker, &amp; icons (192, 512)</text>

    <text x="16" y="82" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="600">client/src/components/</text>
    <text x="195" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">DashboardView, BotsView, Diagnostics, Quota</text>

    <text x="16" y="108" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="600">client/src/services/</text>
    <text x="175" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">API client, REST transport &amp; mock fallbacks</text>

    <text x="16" y="134" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="600">client/src/utils/</text>
    <text x="155" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Official PDF generator, CSV export &amp; formatters</text>

    <text x="16" y="160" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="600">client/src/types/</text>
    <text x="155" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">TypeScript definitions for trading &amp; bot interfaces</text>
  </g>

  <!-- Box 2: src/services/ (Backend Micro-Services) -->
  <g transform="translate(565, 95)">
    <rect width="485" height="185" rx="12" fill="url(#dirCardBg)" stroke="#10b981" stroke-width="1.5" filter="url(#dirGlow)" />
    <rect x="0" y="0" width="485" height="32" rx="12" fill="#047857" />
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      📁 src/services/ — Core Quantitative &amp; AI Engine
    </text>

    <text x="16" y="56" font-family="monospace" font-size="11" fill="#34d399" font-weight="600">signals/</text>
    <text x="100" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Deterministic Section 9 (RSI, EMA, ATR, Depth, Threat, Regime)</text>

    <text x="16" y="82" font-family="monospace" font-size="11" fill="#34d399" font-weight="600">trading/</text>
    <text x="100" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Pure Risk Guard 9 Gates, Trailing Ratchet, Auto-Set Capital</text>

    <text x="16" y="108" font-family="monospace" font-size="11" fill="#34d399" font-weight="600">agents/</text>
    <text x="100" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">10 AI Swarm Analysts &amp; Blackboard SQLite outbox</text>

    <text x="16" y="134" font-family="monospace" font-size="11" fill="#34d399" font-weight="600">indodax/</text>
    <text x="100" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Indodax REST &amp; WS client with 6s in-flight cache</text>

    <text x="16" y="160" font-family="monospace" font-size="11" fill="#34d399" font-weight="600">whatsapp/ &amp; telegram/</text>
    <text x="195" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Baileys Multi-Device &amp; Official Telegram Bot</text>
  </g>

  <!-- Box 3: src/api/, src/db/ & Infrastructure -->
  <g transform="translate(50, 300)">
    <rect width="485" height="185" rx="12" fill="url(#dirCardBg)" stroke="#a855f7" stroke-width="1.5" filter="url(#dirGlow)" />
    <rect x="0" y="0" width="485" height="32" rx="12" fill="#7e22ce" />
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      📁 src/api/, db/, &amp; auth/ — Server &amp; Persistence
    </text>

    <text x="16" y="56" font-family="monospace" font-size="11" fill="#c084fc" font-weight="600">src/server.ts</text>
    <text x="135" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Express server entry point &amp; WebSocket event stream</text>

    <text x="16" y="82" font-family="monospace" font-size="11" fill="#c084fc" font-weight="600">src/api/routes.ts</text>
    <text x="155" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">REST endpoints secured with Zero-Trust Admin Token</text>

    <text x="16" y="108" font-family="monospace" font-size="11" fill="#c084fc" font-weight="600">src/db/index.ts</text>
    <text x="145" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">SQLite WAL engine, schemas, relations &amp; indexes</text>

    <text x="16" y="134" font-family="monospace" font-size="11" fill="#c084fc" font-weight="600">src/services/auth/</text>
    <text x="165" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Token rotation service &amp; timingSafeEqual auth</text>

    <text x="16" y="160" font-family="monospace" font-size="11" fill="#c084fc" font-weight="600">src/services/backup/</text>
    <text x="175" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Automated live database snapshot service</text>
  </g>

  <!-- Box 4: tests/, docs/, & 1-Click Launchers -->
  <g transform="translate(565, 300)">
    <rect width="485" height="185" rx="12" fill="url(#dirCardBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#dirGlow)" />
    <rect x="0" y="0" width="485" height="32" rx="12" fill="#d97706" />
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      📁 tests/, docs/, &amp; Launchers — QA &amp; Execution
    </text>

    <text x="16" y="56" font-family="monospace" font-size="11" fill="#fbbf24" font-weight="600">tests/</text>
    <text x="85" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">131 unit &amp; integration tests covering all critical paths</text>

    <text x="16" y="82" font-family="monospace" font-size="11" fill="#fbbf24" font-weight="600">docs/assets/</text>
    <text x="125" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">High-resolution SVG banners &amp; architecture diagrams</text>

    <text x="16" y="108" font-family="monospace" font-size="11" fill="#fbbf24" font-weight="600">start.bat / start.ps1</text>
    <text x="180" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">1-Click automated launcher for Windows</text>

    <text x="16" y="134" font-family="monospace" font-size="11" fill="#fbbf24" font-weight="600">start.sh</text>
    <text x="95" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Automated launcher for Linux &amp; macOS</text>

    <text x="16" y="160" font-family="monospace" font-size="11" fill="#fbbf24" font-weight="600">docker-compose.yml</text>
    <text x="175" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Multi-stage production container configuration</text>
  </g>
</svg>
