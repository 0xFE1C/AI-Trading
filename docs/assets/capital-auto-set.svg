<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowBox2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1100" height="380" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="50" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
    💰 CAPITAL ALLOCATION AUTO-SET ENGINE
  </text>
  <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    Dynamically scales order size, coin position slots, and cash reserve while strictly respecting Indodax's minimum IDR 10,000 floor.
  </text>

  <!-- 4 Tier Columns -->
  <!-- Tier 1: Micro Capital (< 100k) -->
  <g transform="translate(50, 95)">
    <rect width="230" height="235" rx="12" fill="url(#cardBg2)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowBox2)"/>
    <rect x="0" y="0" width="230" height="32" rx="12" fill="#0284c7"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      Micro: &lt; IDR 100,000
    </text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">Sample Capital: IDR 50,000</text>
    <text x="16" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Max Position: <tspan font-weight="700" fill="#38bdf8">1 Coin</tspan></text>
    <text x="16" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Per Order: <tspan font-weight="700" fill="#38bdf8">IDR 42,500</tspan></text>
    <text x="16" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Safety Cash: <tspan font-weight="700" fill="#94a3b8">15%</tspan></text>
    <text x="16" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Floor Indodax: <tspan font-weight="700" fill="#10b981">✓ Valid (&gt; 10k)</tspan></text>
    <rect x="14" y="175" width="202" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="115" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Focus: 1 high momentum coin</text>
    <text x="115" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Prevents balance fragmentation</text>
  </g>

  <!-- Tier 2: Small Capital (100k - 1M) -->
  <g transform="translate(305, 95)">
    <rect width="230" height="235" rx="12" fill="url(#cardBg2)" stroke="#10b981" stroke-width="1.5" filter="url(#shadowBox2)"/>
    <rect x="0" y="0" width="230" height="32" rx="12" fill="#047857"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      Small: IDR 100k - 1M
    </text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10b981" font-weight="700">Sample Capital: IDR 100,000</text>
    <text x="16" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Max Position: <tspan font-weight="700" fill="#10b981">2 - 3 Coins</tspan></text>
    <text x="16" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Per Order: <tspan font-weight="700" fill="#10b981">IDR 28,000 - 42,500</tspan></text>
    <text x="16" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Safety Cash: <tspan font-weight="700" fill="#94a3b8">15%</tspan></text>
    <text x="16" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Diversification: <tspan font-weight="700" fill="#10b981">✓ Balanced</tspan></text>
    <rect x="14" y="175" width="202" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="115" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Balanced split between</text>
    <text x="115" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">BTC/ETH and momentum coins</text>
  </g>

  <!-- Tier 3: Medium Capital (1M - 10M) -->
  <g transform="translate(560, 95)">
    <rect width="230" height="235" rx="12" fill="url(#cardBg2)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadowBox2)"/>
    <rect x="0" y="0" width="230" height="32" rx="12" fill="#7e22ce"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      Medium: IDR 1M - 10M
    </text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c084fc" font-weight="700">Sample Capital: IDR 1,000,000</text>
    <text x="16" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Max Position: <tspan font-weight="700" fill="#c084fc">3 - 5 Coins</tspan></text>
    <text x="16" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Per Order: <tspan font-weight="700" fill="#c084fc">IDR 170k - 425k</tspan></text>
    <text x="16" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Safety Cash: <tspan font-weight="700" fill="#94a3b8">15%</tspan></text>
    <text x="16" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Dynamic Sizing: <tspan font-weight="700" fill="#c084fc">✓ Optimal</tspan></text>
    <rect x="14" y="175" width="202" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="115" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Slippage budget strictly tracked</text>
    <text x="115" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">Full multi-coin diversification</text>
  </g>

  <!-- Tier 4: Large Capital (> 10M) -->
  <g transform="translate(815, 95)">
    <rect width="235" height="235" rx="12" fill="url(#cardBg2)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowBox2)"/>
    <rect x="0" y="0" width="235" height="32" rx="12" fill="#d97706"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      Large: &gt; IDR 10,000,000
    </text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#fbbf24" font-weight="700">Sample Capital: IDR 10,000,000+</text>
    <text x="16" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Max Position: <tspan font-weight="700" fill="#fbbf24">5 Diversified Coins</tspan></text>
    <text x="16" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Per Order: <tspan font-weight="700" fill="#fbbf24">IDR 1,700,000+</tspan></text>
    <text x="16" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Safety Cash: <tspan font-weight="700" fill="#94a3b8">15% - 25%</tspan></text>
    <text x="16" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Ideal Profile: <tspan font-weight="700" fill="#fbbf24">🛡️ Conservative</tspan></text>
    <rect x="14" y="175" width="207" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="117" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Priority: Deep orderbook depth &amp;</text>
    <text x="117" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">EMA21 structural pullback support</text>
  </g>

  <g transform="translate(50, 345)">
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">
      💡 Instantly configurable via Web Dashboard or Remote WhatsApp/Telegram command: <tspan fill="#38bdf8" font-family="monospace">/capital 500000 moderate</tspan>
    </text>
  </g>
</svg>
