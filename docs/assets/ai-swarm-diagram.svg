  <path d="M 140 200 L 960 200" stroke="#7c3aed" stroke-width="2.5" />
  
  <line x1="140" y1="200" x2="140" y2="230" stroke="#7c3aed" stroke-width="2" />
  <line x1="345" y1="200" x2="345" y2="230" stroke="#7c3aed" stroke-width="2" />
  <line x1="550" y1="200" x2="550" y2="230" stroke="#7c3aed" stroke-width="2" />
  <line x1="755" y1="200" x2="755" y2="230" stroke="#7c3aed" stroke-width="2" />
  <line x1="960" y1="200" x2="960" y2="230" stroke="#7c3aed" stroke-width="2" />

