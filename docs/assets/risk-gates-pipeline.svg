<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="gateCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="failGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="420" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="50" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
    🛡️ PURE RISK GUARD (9 SEQUENTIAL GATES PIPELINE)
  </text>
  <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    Every prospective buy signal must sequentially pass all 9 risk gates. Any single failure triggers an immediate abort.
  </text>

  <!-- Flow Line Background -->
  <path d="M 60 155 L 1040 155" stroke="#334155" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Row 1: Gates 1 to 5 -->
  <!-- Gate 1: Circuit Breaker -->
  <g transform="translate(50, 105)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#0284c7"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 1: Circuit Breaker</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Max Daily Drawdown</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Halts entries on daily loss</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">24h decoupled cooldown</text>
  </g>

  <!-- Gate 2: Exposure Capacity -->
  <g transform="translate(255, 105)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#0284c7"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 2: Exposure Limit</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Position Slot Capacity</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Limit: 1 - 5 coins</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">Prevents over-exposure</text>
  </g>

  <!-- Gate 3: BTC Regime -->
  <g transform="translate(460, 105)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#0284c7"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 3: BTC Regime</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Flash Crash Blocker</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">BTC 1h &lt; -3% / 4h &lt; -5%</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">Market veto during dump</text>
  </g>

  <!-- Gate 4: Spread Trap -->
  <g transform="translate(665, 105)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#0284c7"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 4: Spread Trap</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Bid-Ask Gap Check</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Spread limit &lt; 0.8% - 1.5%</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">Prevents illiquid traps</text>
  </g>

  <!-- Gate 5: RSI Guard -->
  <g transform="translate(870, 105)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#0284c7"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 5: RSI Guard</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Anti-FOMO Top Shield</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">RSI(14) must be &lt; 70-75</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">Rejects overbought candles</text>
  </g>

  <!-- Connecting Line Down to Row 2 -->
  <path d="M 960 205 L 960 235 L 140 235 L 140 255" stroke="#334155" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Row 2: Gates 6 to 9 + Execution Outcome -->
  <!-- Gate 6: Threat Scope -->
  <g transform="translate(50, 255)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#d97706"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 6: Threat Scoping</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Incident &amp; Exploit Radar</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Scoped per coin (30m fresh)</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">Vetoes compromised assets</text>
  </g>

  <!-- Gate 7: Slippage Budget -->
  <g transform="translate(255, 255)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#d97706"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 7: Slippage Budget</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Order Depth Fill Sim</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Top 5 Asks orderbook walk</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">Rejects if slippage &gt; 0.5%</text>
  </g>

  <!-- Gate 8: Technical Score -->
  <g transform="translate(460, 255)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#d97706"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 8: Tech &amp; Setup</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Minimum Threshold</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Score &gt;= 70 (Pullback/Mom)</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">EMA21 + Buyer depth wall</text>
  </g>

  <!-- Gate 9: Min Floor -->
  <g transform="translate(665, 255)">
    <rect width="180" height="100" rx="10" fill="url(#gateCardBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowBox)"/>
    <rect x="0" y="0" width="180" height="26" rx="10" fill="#d97706"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Gate 9: Min Indodax Floor</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Indodax Exchange Rules</text>
    <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Order nominal &gt;= IDR 10,000</text>
    <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">Prevents exchange rejection</text>
  </g>

  <!-- Final Destination: ALL PASSED -> ORDER EXECUTED -->
  <g transform="translate(870, 255)">
    <rect width="180" height="100" rx="10" fill="url(#passGrad)" stroke="#34d399" stroke-width="2" filter="url(#shadowBox)"/>
    <text x="90" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
      ✓ 100% PASSED
    </text>
    <text x="90" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ecfdf5" text-anchor="middle">
      ORDER EXECUTED
    </text>
    <text x="90" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">
      Dispatched to Indodax
    </text>
    <text x="90" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">
      &amp; Trailing Ratchet Active
    </text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(50, 375)">
    <circle cx="8" cy="8" r="5" fill="#ef4444"/>
    <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
      <tspan fill="#f87171" font-weight="700">If FAILED at any gate:</tspan> Order is aborted instantly, logged in <tspan fill="#38bdf8">entry_gate_logs</tspan>, and tracked as a <tspan fill="#a855f7">Ghost Position</tspan> to benchmark AI Alpha.
    </text>
  </g>
</svg>
